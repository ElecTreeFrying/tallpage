<h1>Tallpage</h1>
<p class="u-hint">Downloads this page, top to bottom.</p>

<div class="actions">
  <button type="button" [disabled]="busy()" (click)="download('png')">
    Download full page as PNG
  </button>
  <button type="button" [disabled]="busy()" (click)="download('pdf')">
    Download full page as PDF
  </button>
  <button type="button" [disabled]="busy()" (click)="download('html')">
    Download full page as HTML
  </button>
  <button type="button" [disabled]="busy()" (click)="download('md')">
    Download full page as Markdown
  </button>
</div>

@if (busy()) {
  <div class="bar" aria-hidden="true"><span></span></div>
}

@if (status(); as message) {
  <p class="u-hint status" role="status">{{ message }}</p>
}

<div class="footer">
  <button type="button" class="quiet" (click)="openOptions()">Options</button>
</div>
