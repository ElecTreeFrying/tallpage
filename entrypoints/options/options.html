<h1>Blank Slate — Options</h1>
<p class="u-hint">Options page — replace this with your settings UI.</p>

<div class="u-row">
  <label>
    <input
      type="checkbox"
      [checked]="settings()?.enabled ?? false"
      [disabled]="settings() === null"
      (change)="onToggle($event)" />
    Enabled
  </label>
</div>
