<h1>Tallpage — Options</h1>
<p class="u-hint">
  Files are always downloaded. Choose whether Tallpage also opens them.
</p>

<div class="u-row">
  <label>
    <input
      type="checkbox"
      [checked]="settings()?.openAfterDownload ?? true"
      [disabled]="settings() === null"
      (change)="onOpenAfterDownloadChange($event)" />
    Open downloaded files in a new tab
  </label>
</div>

<p class="privacy">
  Tallpage processes exports on your device and does not send page content to a
  Tallpage server.
</p>
